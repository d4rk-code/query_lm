<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query LM_</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='chat/chat.css') }}">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <div class="layout">

        <div class="hero-section">
            <p class="tagline">INTERNAL AI ANALYTICS SYSTEM</p>
            <h1 class="hero-heading">Query LM_</h1>
        </div>

        <div class="content-column">

            <div id="response-box">
                <div class="response-window empty-state" id="window-wrapper">
                    
                    <div class="window-header">
                        <span class="dot red"></span>
                        <span class="dot yellow"></span>
                        <span class="dot green"></span>

                        <div class="scanner-container">
                            <div class="magnifier">
                                <svg class="lens-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                                <div class="scanner-beam"></div>
                            </div>
                        </div>

                        <span class="window-title" id="header-title">QUERY LM_</span>
                    </div>

                    <div class="empty-content" id="dynamic-container">
                        <h2 class="welcome-title">Hi! I'm ready.</h2>
                        <p class="welcome-text">Drop your dataset parameters or type an analytics query below. Let's see what the data is trying to hide.</p>
                    </div>

                </div>
            </div>

            <form id="chat-form">
                <input 
                    type="text" 
                    id="user-query"
                    name="query" 
                    placeholder="Ask analytics query..." 
                    required
                >
                <button type="submit" id="submit-btn">
                    Analyze
                    <span class="arrow">→</span>
                </button>
            </form>

        </div>

    </div>

    <script src="{{ url_for('static', filename='chat/chat.js') }}"></script>

</body>
</html>
